name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify formatting
        run: python -m black --check src scripts tests
      - name: Verify source compilation
        run: python -m compileall -q src scripts tests
      - name: Check experiment inputs
        run: python scripts/run_experiment.py --check-data
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
