[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hysteresis-discovery"
version = "0.1.0"
description = "Equation discovery and dynamic prediction of hysteretic systems"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [
  {name = "Siyuan Yang"},
  {name = "Wei Liu"},
  {name = "Zhilu Lai"},
]
keywords = ["hysteresis", "symbolic-regression", "system-identification", "neural-ode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
hysteresis-discovery = "hysteresis_discovery.cli:main"

[project.urls]
Paper = "https://doi.org/10.1016/j.ymssp.2026.114725"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '/(outputs|tmp)/'
